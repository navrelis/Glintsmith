modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/navrelis/Glintsmith/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/navrelis/Glintsmith"
logoFile="assets/glintsmith/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

# Client-only mod: the entry point has @Mod(dist = Dist.CLIENT), so it never loads on a dedicated server, and the
# dependencies below only apply on the client. A server without the mod accepts a client with it (no network payloads).
[[mixins]]
config="glintsmith.mixins.json"

[[mixins]]
config="glintsmith.glint.mixins.json"

[[mixins]]
config="glintsmith.outline.mixins.json"

[[mixins]]
config="glintsmith.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version_range_min},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
