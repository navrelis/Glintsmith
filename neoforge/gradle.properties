# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# NeoForge Properties
# https://projects.neoforged.net/neoforged/neoforge
# The NeoForge version this build compiles and runs against.
neo_version=21.1.264
# Minimum NeoForge declared in neoforge.mods.toml: the first NeoForge for Minecraft 1.21 (the 1.21 - 1.21.1 range).
neoforge_version_range_min=21.0.167
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[1,)
# Minecraft versions this jar declares (Maven range of neoforge.mods.toml).
minecraft_version_range=[1.21,1.21.2)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Dependencies
junit_version=5.10.2

# Optional integrations (compile-only, never bundled)
iris_version=1.8.14-beta.1+1.21.1-neoforge
