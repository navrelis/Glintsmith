plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.147'
}

// Jar: glintsmith-<mod version>+<minecraft version>-neoforge.jar
// (mod_id, mod_version, minecraft_version, ... come from ../gradle/shared.properties, see settings.gradle)
version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group

base {
	archivesName = mod_id
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

repositories {
	mavenCentral()

	// Optional integrations. The repository only serves the group listed in its content filter.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

sourceSets {
	main {
		java.srcDir "${commonDir}/src/main/java"
		resources.srcDir "${commonDir}/src/main/resources"
	}
	test {
		java.srcDir "${commonDir}/src/test/java"
	}
	// Dev-only in-game smoke test (docs/TESTING.md): the loader-neutral runner from ../common/src/smoke plus the NeoForge
	// wiring in src/smoke, as its own mod (glintsmith_smoke). Never packaged.
	smoke {
		java.srcDir "${commonDir}/src/smoke/java"
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
	// Empty source set of the runSmokeExported run: only Minecraft and NeoForge, every mod comes from run-smoke-exported/mods.
	exportedStub {
	}
}

neoForge {
	version = neo_version

	parchment {
		minecraftVersion = parchment_minecraft_version
		mappingsVersion = parchment_mappings_version
	}

	// The common tests load Minecraft and mod classes (class references, the mixin plugin), so they need Minecraft on
	// their classpath too. They run as plain JUnit 5, not inside the game.
	addModdingDependenciesTo sourceSets.test
	addModdingDependenciesTo sourceSets.smoke
	addModdingDependenciesTo sourceSets.exportedStub

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
		"glintsmith_smoke" {
			sourceSet sourceSets.smoke
		}
	}

	runs {
		client {
			client()
			gameDirectory = file('run')
			sourceSet = sourceSets.main
			loadedMods = [mods."${mod_id}"]
			// Where the client log of a manual check is written; also gives the mixin trace on request.
			jvmArguments.add '-Dmixin.debug.verbose=true'
			logLevel = org.slf4j.event.Level.DEBUG
		}

		// ./gradlew runSmoke (or scripts/smoke.ps1): loads a test world, takes screenshots, writes
		// run-smoke/smoke-result.json and exits. See docs/TESTING.md.
		smoke {
			client()
			gameDirectory = file('run-smoke')
			sourceSet = sourceSets.smoke
			loadedMods = [mods."${mod_id}", mods."glintsmith_smoke"]
			systemProperty 'glintsmith.smoke.minecraft', minecraft_version
			systemProperty 'glintsmith.smoke.version', mod_version
			programArguments.addAll '--width', '1280', '--height', '720'
		}

		// Client that loads only the jars in run-smoke-exported/mods (the released jar and the smoke mod jar); nothing from this
		// project. See runSmokeExported below.
		smokeExported {
			client()
			sourceSet = sourceSets.exportedStub
			loadedMods = []
			gameDirectory = file('run-smoke-exported')
			systemProperty 'glintsmith.smoke.minecraft', minecraft_version
			systemProperty 'glintsmith.smoke.version', mod_version
			programArguments.addAll '--width', '1280', '--height', '720'
		}
	}
}

dependencies {
	// Optional integration: compile-only, never bundled, never on the runtime classpath.
	// common/ references net.irisshaders.iris.api.v0.IrisApi (IrisCompat).
	compileOnly "maven.modrinth:iris:${project.iris_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Fills neoforge.mods.toml with the values of shared.properties and gradle.properties.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	def replaceProperties = [
		neo_version                  : neo_version,
		neoforge_version_range_min   : neoforge_version_range_min,
		neoforge_loader_version_range: neoforge_loader_version_range,
		minecraft_version_range      : minecraft_version_range,
		mod_id                       : mod_id,
		mod_name                     : mod_name,
		mod_license                  : mod_license,
		mod_version                  : mod_version,
		mod_authors                  : mod_authors,
		mod_description              : mod_description
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from 'src/main/templates'
	into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Part of the resources of main, for Gradle and for the IDE.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

// ../common must stay loader-neutral: loader and optional-mod APIs are only reached through the platform service
// (navrelis.glintsmith.platform).
tasks.register("checkCommonIsLoaderNeutral") {
	def sources = fileTree("${commonDir}/src/main/java") { include "**/*.java" }
	inputs.files sources
	doLast {
		def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|com\.terraformersmc|net\.neoforged|net\.minecraftforge)\./
		def offenders = sources.files.collectMany { file ->
			file.readLines("UTF-8").findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
		}
		if (!offenders.isEmpty()) {
			throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join("\n"))
		}
	}
}

// The smoke test is compiled with every build so it cannot rot; it is never packaged.
tasks.named("check") {
	dependsOn tasks.named("smokeClasses"), tasks.named("checkCommonIsLoaderNeutral")
}

// The smoke runs start from a clean run folder (no old result, screenshots or worlds) with the fixed smoke config, and fail
// unless the game wrote a result that says every step passed. `prepare` puts the mods of the run in place.
def smokeConfig = file("${commonDir}/src/smoke/resources/glintsmith-smoke.json")
def configureSmokeRun = { Task task, String dirName, Closure prepare ->
	def runDir = file(dirName)
	task.inputs.file smokeConfig
	task.timeout = java.time.Duration.ofMinutes(9)
	// The result file decides; the exit code is checked after the result was read
	task.ignoreExitValue = true
	task.doFirst {
		["smoke-result.json", "screenshots", "saves", "logs/latest.log", "config/glintsmith.json"].each {
			delete new File(runDir, it)
		}
		new File(runDir, "config").mkdirs()
		// No early display window: the game creates its window itself, without taking the focus (SmokeWindowMixin)
		new File(runDir, "config/fml.toml").text = """earlyWindowControl = false
disableConfigWatcher = false
maxThreads = -1
versionCheck = false
defaultConfigPath = "defaultconfigs"
disableOptimizedDFU = true
earlyWindowProvider = "fmlearlywindow"
earlyWindowWidth = 854
earlyWindowHeight = 480
earlyWindowFBScale = 1
earlyWindowMaximized = false
earlyWindowSkipGLVersions = []
earlyWindowSquir = false
"""
		java.nio.file.Files.copy(smokeConfig.toPath(), new File(runDir, "config/glintsmith.json").toPath())
		prepare(runDir)
	}
	task.doLast {
		def result = new File(runDir, "smoke-result.json")
		if (!result.isFile()) {
			throw new GradleException("The smoke run wrote no result (${result}); see ${runDir}/logs/latest.log")
		}
		def json = new groovy.json.JsonSlurper().parse(result)
		(json.steps ?: []).each { logger.lifecycle("  ${it.ok ? 'ok  ' : 'FAIL'} ${it.name}${it.error ? ': ' + it.error : ''}") }
		if (!json.passed) {
			throw new GradleException("Smoke run FAILED${json.fatal ? ': ' + json.fatal : ''} (${result})")
		}
		def exit = task.executionResult.get().exitValue
		if (exit != 0) {
			throw new GradleException("Every smoke step passed but the game exited with code ${exit}")
		}
		logger.lifecycle("Smoke run passed in ${json.durationMs} ms: ${runDir}")
	}
}

tasks.named("runSmoke") {
	configureSmokeRun(it, "run-smoke") { }
}

// The smoke mod as a jar (smoke classes and metadata only), for the exported run.
def smokeJar = tasks.register("smokeJar", Jar) {
	// Not in build/libs: only the released jars are there
	destinationDirectory = layout.buildDirectory.dir("smoke-libs")
	archiveBaseName = "glintsmith-smoke"
	archiveVersion = "${mod_version}+${minecraft_version}-neoforge"
	from sourceSets.smoke.output
}

// runSmokeExported: the same test, but the game loads the RELEASED jar (build/libs) and the smoke mod jar from the mods
// folder of run-smoke-exported instead of the dev classes, so the access transformer, the mod metadata and the mixin configs
// of the real jar are exercised.
tasks.named("runSmokeExported") {
	dependsOn tasks.named("jar"), smokeJar
	configureSmokeRun(it, "run-smoke-exported") { File runDir ->
		def mods = new File(runDir, "mods")
		mods.deleteDir()
		mods.mkdirs()
		[tasks.named("jar").get().archiveFile.get().asFile, smokeJar.get().archiveFile.get().asFile].each {
			java.nio.file.Files.copy(it.toPath(), new File(mods, it.name).toPath())
		}
	}
}

// Resolved while configuring: the licence file is named after the mod id.
def licenseFileName = "LICENSE_${mod_id}"
tasks.named('jar', Jar) {
	from("../LICENSE") {
		rename { licenseFileName }
	}
}
