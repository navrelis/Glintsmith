# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
# Compiled against 52.1.2; the mod accepts that build and every later Forge 52 build (forge_version_range).
forge_version=52.1.2
forge_version_range=[52.1.2,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[52,)
# Minecraft range of the Forge jar: only 1.21.1. Forge 51 (the only Forge for Minecraft 1.21.0) is a separate loader
# major without FMLJavaModLoadingContext constructor injection and is not supported.
forge_minecraft_version_range=[1.21.1,1.21.2)

# Dependencies
junit_version=5.10.2

# Optional integrations (compile-only, never bundled)
iris_version=1.8.14-beta.1+1.21.1-fabric

# MixinExtras: the version Fabric Loader 0.19.5 bundles (Forge 52 does not ship it)
mixinextras_version=0.5.5
