plugins {
	id 'java-library'
	id 'idea'
	id 'net.minecraftforge.gradle' version '7.0.40'
}

// Jar: glintsmith-<mod version>+<minecraft version>-forge.jar
// (mod_id, mod_version, minecraft_version, ... come from ../gradle/shared.properties, see settings.gradle)
version = "${mod_version}+${minecraft_version}-forge"
group = mod_group

base {
	archivesName = mod_id
}

java {
	// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
	toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
	withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
	main {
		java.srcDir "${commonDir}/src/main/java"
		resources.srcDir "${commonDir}/src/main/resources"
	}
	test {
		java.srcDir "${commonDir}/src/test/java"
	}
	// Dev-only in-game smoke test (docs/TESTING.md): the loader-neutral runner from ../common/src/smoke plus the Forge
	// wiring in src/smoke, as its own mod (glintsmith_smoke, META-INF/mods.toml: every classpath folder with a mods.toml
	// is a mod in the Forge dev runtime). Only loaded by runSmoke, never packaged.
	smoke {
		java.srcDir "${commonDir}/src/smoke/java"
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
	// Empty source set of the runSmokeExported run: only Minecraft and Forge, every mod (Glintsmith with MixinExtras inside
	// its jar, the smoke mod) comes from run-smoke-exported/mods.
	// (Named after "main" alphabetically: ForgeGradle takes the access transformer from the first source set; "exported" broke it.)
	released {
	}
}

// The smoke test compiles and runs against everything main does; ForgeGradle then also creates the smoke variants of the
// runs (runSmokeClient, runReleasedClient).
configurations {
	smokeImplementation.extendsFrom implementation
	smokeRuntimeOnly.extendsFrom runtimeOnly
	releasedImplementation.extendsFrom implementation
}

// The three shared mixin configs (common) and the Forge-only one (src/main/resources).
def mixinConfigs = [
	'glintsmith.mixins.json',
	'glintsmith.glint.mixins.json',
	'glintsmith.outline.mixins.json',
	'glintsmith.forge.mixins.json'
]

minecraft {
	// common/ needs vanilla members that Fabric API's access widener opens up; here the transformer does it.
	useDefaultAccessTransformer() // src/main/resources/META-INF/accesstransformer.cfg

	// Official Mojang names; Forge runs on them since 1.20.6, so the jar is not reobfuscated.
	mappings channel: 'official', version: minecraft_version

	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
		}

		register('client') {
			// A dev run loads classes from folders, so there is no jar manifest: the mixin configs go in as arguments (the jar
			// names them in its MixinConfigs manifest attribute, see jar below). Only the runs on dev classes get them: the
			// run of the released jar must find them through the manifest.
			with(sourceSets.main) {
				mixinConfigs.each { args "--mixin.config=${it}" }
				// gradlew runClient -PmixinExport: writes every mixed class to run/.mixin.out, to check what was injected.
				if (project.hasProperty('mixinExport')) {
					systemProperty 'mixin.debug.export', 'true'
				}
			}
			// runSmokeClient (alias runSmoke): a real client creates a fresh superflat world, takes the screenshots, writes
			// run-smoke/smoke-result.json and exits.
			with(sourceSets.smoke) {
				workingDir = layout.projectDirectory.dir('run-smoke')
				systemProperty 'glintsmith.smoke.minecraft', minecraft_version
				systemProperty 'glintsmith.smoke.version', mod_version
				mixinConfigs.each { args "--mixin.config=${it}" }
				// The smoke mod's mixins (SmokeClientStartMixin, SmokeWindowMixin)
				args '--mixin.config=glintsmith_smoke.mixins.json'
				args '--width', '1280', '--height', '720'
			}
			// runReleasedClient (alias runSmokeExported): the same, but only the jars of run-smoke-exported/mods are loaded.
			with(sourceSets.released) {
				workingDir = layout.projectDirectory.dir('run-smoke-exported')
				systemProperty 'glintsmith.smoke.minecraft', minecraft_version
				systemProperty 'glintsmith.smoke.version', mod_version
				args '--width', '1280', '--height', '720'
			}
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()

	// Optional integrations. Each repository only serves the groups listed in its content filter.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Forge 52's dev runs stop with "Module jopt.simple not found, required by cpw.mods.modlauncher": its bootstrap-api
// pulls in jopt-simple 6.0-alpha-3 (module "joptsimple"). 5.0.4 has the module name modlauncher asks for.
configurations.configureEach {
	resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

dependencies {
	// The unit tests exercise vanilla types: testImplementation extends implementation, so Minecraft is on their
	// classpath too.
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

	// Optional integration: compile-only, never bundled, never on the runtime classpath (Iris does not exist for Forge;
	// common only touches its API after isModLoaded("iris")).
	compileOnly "maven.modrinth:iris:${iris_version}"

	// MixinExtras (used by the common mixins): the API classes for compiling here; at runtime it is bundled, see jarJar below.
	compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
	runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Expands the replace properties in the templates (META-INF/mods.toml and pack.mcmeta; Forge ignores the resources of a
// mod without pack.mcmeta). A missing property is an error.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	var replaceProperties = [
		minecraft_version_range   : forge_minecraft_version_range,
		forge_version_range       : forge_version_range,
		forge_loader_version_range: forge_loader_version_range,
		mod_id                    : mod_id,
		mod_name                  : mod_name,
		mod_license               : mod_license,
		mod_version               : mod_version,
		mod_authors               : mod_authors,
		mod_description           : mod_description
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from 'src/main/templates'
	into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build.
sourceSets.main.resources.srcDir generateModMetadata

// merge-source-sets puts the classes and the resources of a source set into one directory, so compileJava and
// processResources have overlapping outputs. processResources is not incremental: before it runs, Gradle deletes its
// previous outputs, and after a compileJava restored from the build cache those can include the classes (the jar then
// had no classes). So processResources is not tracked (it always runs and never deletes anything; stale resources go
// with clean) and runs after the compile task of its source set.
sourceSets.configureEach { sourceSet ->
	tasks.named(sourceSet.processResourcesTaskName) {
		doNotTrackState('Shares its output directory with the compile task (merge-source-sets)')
		mustRunAfter tasks.named(sourceSet.compileJavaTaskName)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

// ../common must stay loader-neutral: loader and optional-mod APIs are only reached through the platform service
// (navrelis.glintsmith.platform).
tasks.register('checkCommonIsLoaderNeutral') {
	def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
	inputs.files sources
	doLast {
		def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|com\.terraformersmc|net\.neoforged|net\.minecraftforge)\./
		def offenders = sources.files.collectMany { file ->
			file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
		}
		if (!offenders.isEmpty()) {
			throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
		}
	}
}

// The smoke test is compiled with every build so it cannot rot; it is never packaged.
tasks.named('check') {
	dependsOn tasks.named('checkCommonIsLoaderNeutral'), tasks.named('smokeClasses')
}

// The smoke runs start from a clean run folder (no old result, screenshots or worlds) with the fixed smoke config, and fail
// unless the game wrote a result that says every step passed. `prepare` puts the mods of the run in place.
def smokeConfig = file("${commonDir}/src/smoke/resources/glintsmith-smoke.json")
def configureSmokeRun = { Task task, String dirName, Closure prepare ->
	def runDir = file(dirName)
	task.inputs.file smokeConfig
	task.timeout = java.time.Duration.ofMinutes(9)
	// The result file decides; the exit code is checked after the result was read
	task.ignoreExitValue = true
	// The bookkeeping closures below use script objects at execution time
	task.notCompatibleWithConfigurationCache('smoke run bookkeeping')
	task.doFirst {
		['smoke-result.json', 'screenshots', 'saves', 'logs/latest.log', 'config/glintsmith.json'].each {
			def target = new File(runDir, it)
			if (target.directory) { target.deleteDir() } else { target.delete() }
		}
		new File(runDir, 'config').mkdirs()
		java.nio.file.Files.copy(smokeConfig.toPath(), new File(runDir, 'config/glintsmith.json').toPath())
		// No early display window: the game creates its window itself, without taking the focus (SmokeWindowMixin).
		// Other settings of the file are kept.
		File fmlToml = new File(runDir, 'config/fml.toml')
		List<String> lines = fmlToml.file ? fmlToml.readLines('UTF-8').findAll { !(it.trim() ==~ /earlyWindowControl\s*=.*/) } : []
		lines.add('earlyWindowControl = false')
		fmlToml.setText(lines.join('\n') + '\n', 'UTF-8')
		prepare(runDir)
	}
	task.doLast {
		def result = new File(runDir, 'smoke-result.json')
		if (!result.isFile()) {
			throw new GradleException("The smoke run wrote no result (${result}); see ${runDir}/logs/latest.log")
		}
		def json = new groovy.json.JsonSlurper().parse(result)
		(json.steps ?: []).each { logger.lifecycle("  ${it.ok ? 'ok  ' : 'FAIL'} ${it.name}${it.error ? ': ' + it.error : ''}") }
		if (!json.passed) {
			throw new GradleException("Smoke run FAILED${json.fatal ? ': ' + json.fatal : ''} (${result})")
		}
		def exit = task.executionResult.get().exitValue
		if (exit != 0) {
			throw new GradleException("Every smoke step passed but the game exited with code ${exit}")
		}
		logger.lifecycle("Smoke run passed in ${json.durationMs} ms: ${runDir}")
	}
}

tasks.matching { it.name == 'runSmokeClient' }.configureEach {
	configureSmokeRun(it, 'run-smoke') { }
}
tasks.register('runSmoke') {
	group = 'Slime Launcher'
	description = 'Runs the in-game smoke test (runSmokeClient).'
	dependsOn 'runSmokeClient'
}

// The smoke mod as a jar (smoke classes and metadata only), for the exported run.
def smokeJar = tasks.register('smokeJar', Jar) {
	// Not in build/libs: only the released jars are there
	destinationDirectory = layout.buildDirectory.dir("smoke-libs")
	archiveBaseName = 'glintsmith-smoke'
	archiveVersion = "${mod_version}+${minecraft_version}-forge"
	from sourceSets.smoke.output
	manifest {
		attributes 'MixinConfigs': 'glintsmith_smoke.mixins.json'
	}
}

// runSmokeExported: the same test, but the game loads the RELEASED jar (build/libs, with MixinExtras inside as jar-in-jar,
// the MixinConfigs manifest attribute and the access transformer) and the smoke mod jar from the mods folder of
// run-smoke-exported instead of the dev classes.
def releasedJars = [tasks.named('jar').get().archiveFile.get().asFile, smokeJar.get().archiveFile.get().asFile]
tasks.matching { it.name == 'runReleasedClient' }.configureEach {
	dependsOn tasks.named('jar'), smokeJar
	configureSmokeRun(it, 'run-smoke-exported') { File runDir ->
		def mods = new File(runDir, 'mods')
		mods.deleteDir()
		mods.mkdirs()
		releasedJars.each {
			java.nio.file.Files.copy(it.toPath(), new File(mods, it.name).toPath())
		}
	}
}
tasks.register('runSmokeExported') {
	group = 'Slime Launcher'
	description = 'Runs the in-game smoke test with the released jar (runReleasedClient).'
	dependsOn 'runReleasedClient'
}

// Jar in jar: Forge 52 does not ship MixinExtras (checked: neither the Forge installer libraries nor the userdev
// dependencies list it), but the common mixins need it. It is bundled as META-INF/jarjar/<jar> plus the metadata.json
// that FML reads (the ForgeGradle 7 build has no jarJar of its own; this writes the same layout). The range lets the
// highest MixinExtras of all installed mods win.
configurations.create('jarJar') {
	canBeConsumed = false
	canBeResolved = true
	transitive = false
}
dependencies {
	jarJar "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
}
def jarJarMetadataDir = layout.buildDirectory.dir('generated/jarjar')
def mixinExtrasVersion = mixinextras_version
def jarJarMetadata = tasks.register('generateJarJarMetadata') {
	def out = jarJarMetadataDir.map { it.file('META-INF/jarjar/metadata.json') }
	inputs.property 'mixinExtrasVersion', mixinExtrasVersion
	outputs.file out
	doLast {
		def file = out.get().asFile
		file.parentFile.mkdirs()
		file.text = """{
	"jars": [
		{
			"identifier": {"group": "io.github.llamalad7", "artifact": "mixinextras-forge"},
			"version": {"range": "[${mixinExtrasVersion},)", "artifactVersion": "${mixinExtrasVersion}"},
			"path": "META-INF/jarjar/mixinextras-forge-${mixinExtrasVersion}.jar",
			"isObfuscated": false
		}
	]
}
"""
	}
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}"
def mixinConfigsAttribute = mixinConfigs.join(',')
tasks.named('jar', Jar) {
	dependsOn jarJarMetadata
	from(jarJarMetadataDir)
	into('META-INF/jarjar') {
		from configurations.jarJar
	}
	manifest {
		attributes 'MixinConfigs': mixinConfigsAttribute
	}
	from(file('../LICENSE')) {
		rename { licenseFileName }
	}
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
