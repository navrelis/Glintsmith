plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'glintsmith'
}

repositories {
	mavenCentral()

	// Optional integrations. Each repository only serves the groups listed in its content filter.
	maven {
		name = 'CaffeineMC'
		url = 'https://maven.caffeinemc.net/releases/'
		content {
			includeGroup 'net.caffeinemc'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
			includeGroup 'dev.emi'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Dev-only "studio" render mode (docs/STUDIO.md): its own source set and mod (glintsmith_studio). Nothing of it ends
// up in the released jar, which is built from sourceSets.main only.
sourceSets {
	studio {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"glintsmith" {
			sourceSet sourceSets.main
		}
		"glintsmith_studio" {
			sourceSet sourceSets.studio
		}
	}

	runs {
		// ./gradlew runStudio -Pscene=<scene file, or the name of a scene in src/studio/resources/scenes>
		studio {
			client()
			name = "Glintsmith Studio"
			source sourceSets.studio
			runDir "run-studio"
			ideConfigGenerated false
			property "glintsmith.studio.repo", projectDir.absolutePath
			def scene = project.findProperty("scene")
			if (scene != null) {
				def sceneFile = file(scene.toString())
				property "glintsmith.studio.scene", sceneFile.isFile() ? sceneFile.absolutePath : scene.toString()
			}
			def studioOut = project.findProperty("studioOut")
			if (studioOut != null) {
				property "glintsmith.studio.out", file(studioOut.toString()).absolutePath
			}
			// Optional local mod jars (git-ignored), so a scene can show items of other mods without a build dependency.
			def extraMods = file("studio-mods").listFiles()?.findAll { it.isFile() && it.name.endsWith(".jar") }?.sort { it.name }
			if (extraMods) {
				property "fabric.addMods", extraMods.collect { it.absolutePath }.join(File.pathSeparator)
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: compile-only, never bundled, never on the runtime classpath.
	modCompileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Boots Fabric Loader (and therefore the mixins) inside a plain JUnit run.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()

	// Keep loader/bootstrap scratch files (logs, .fabric, config) out of the project root.
	workingDir = layout.buildDirectory.dir("test-run").get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Compile the studio with every build so it cannot rot; it is never packaged.
tasks.named("check") {
	dependsOn tasks.named("studioClasses")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}
