plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Jar: glintsmith-<mod version>+<minecraft version>-fabric.jar
// (mod_id, mod_version, minecraft_version, ... come from ../gradle/shared.properties, see settings.gradle)
version = "${mod_version}+${minecraft_version}-fabric"
group = mod_group

base {
	archivesName = mod_id
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

repositories {
	mavenCentral()

	// Optional integrations. Each repository only serves the groups listed in its content filter.
	maven {
		name = 'CaffeineMC'
		url = 'https://maven.caffeinemc.net/releases/'
		content {
			includeGroup 'net.caffeinemc'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
			includeGroup 'dev.emi'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Dev-only "studio" render mode (docs/STUDIO.md): its own source set and mod (glintsmith_studio). Nothing of it ends
// up in the released jar, which is built from sourceSets.main only.
sourceSets {
	main {
		java.srcDir "${commonDir}/src/main/java"
		resources.srcDir "${commonDir}/src/main/resources"
	}
	test {
		java.srcDir "${commonDir}/src/test/java"
	}
	studio {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
	// Dev-only in-game smoke test (docs/TESTING.md): the loader-neutral runner from ../common/src/smoke plus the Fabric
	// wiring in src/smoke, as its own mod (glintsmith_smoke). Never packaged.
	smoke {
		java.srcDir "${commonDir}/src/smoke/java"
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"glintsmith" {
			sourceSet sourceSets.main
		}
		"glintsmith_studio" {
			sourceSet sourceSets.studio
		}
		"glintsmith_smoke" {
			sourceSet sourceSets.smoke
		}
	}

	runs {
		// ./gradlew runStudio -Pscene=<scene file, or the name of a scene in src/studio/resources/scenes>
		// (run from this folder; a relative scene path is relative to it)
		studio {
			client()
			name = "Glintsmith Studio"
			source sourceSets.studio
			// The run folder and the optional mod jars stay at the repository root, next to art/.
			runDir "../run-studio"
			ideConfigGenerated false
			property "glintsmith.studio.repo", projectDir.parentFile.absolutePath
			def scene = project.findProperty("scene")
			if (scene != null) {
				def sceneFile = file(scene.toString())
				property "glintsmith.studio.scene", sceneFile.isFile() ? sceneFile.absolutePath : scene.toString()
			}
			def studioOut = project.findProperty("studioOut")
			if (studioOut != null) {
				property "glintsmith.studio.out", file(studioOut.toString()).absolutePath
			}
			// Optional local mod jars (git-ignored), so a scene can show items of other mods without a build dependency.
			def extraMods = file("../studio-mods").listFiles()?.findAll { it.isFile() && it.name.endsWith(".jar") }?.sort { it.name }
			if (extraMods) {
				property "fabric.addMods", extraMods.collect { it.absolutePath }.join(File.pathSeparator)
			}
		}

		// ./gradlew runSmoke (or scripts/smoke.ps1): loads a test world, takes screenshots, writes
		// run-smoke/smoke-result.json and exits. See docs/TESTING.md.
		smoke {
			client()
			name = "Glintsmith Smoke"
			source sourceSets.smoke
			runDir "run-smoke"
			ideConfigGenerated false
			property "glintsmith.smoke.minecraft", minecraft_version
			property "glintsmith.smoke.version", mod_version
			programArgs "--width", "1280", "--height", "720"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: compile-only, never bundled, never on the runtime classpath.
	modCompileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Boots Fabric Loader (and therefore the mixins) inside a plain JUnit run.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()

	// Keep loader/bootstrap scratch files (logs, .fabric, config) out of the project root.
	workingDir = layout.buildDirectory.dir("test-run").get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}

processResources {
	// fabric.mod.json takes the mod version (not the jar version) and the Minecraft version predicate.
	def expandProps = [
		version        : mod_version,
		minecraft_range: fabric_minecraft_range
	]
	inputs.properties expandProps

	filesMatching("fabric.mod.json") {
		expand expandProps
	}
}

// ../common must stay loader-neutral: loader and optional-mod APIs are only reached through the platform service
// (navrelis.glintsmith.platform).
tasks.register("checkCommonIsLoaderNeutral") {
	def sources = fileTree("${commonDir}/src/main/java") { include "**/*.java" }
	inputs.files sources
	doLast {
		def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|com\.terraformersmc|net\.neoforged|net\.minecraftforge)\./
		def offenders = sources.files.collectMany { file ->
			file.readLines("UTF-8").findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
		}
		if (!offenders.isEmpty()) {
			throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join("\n"))
		}
	}
}

// Compile the studio and the smoke test with every build so they cannot rot; neither is ever packaged.
tasks.named("check") {
	dependsOn tasks.named("studioClasses"), tasks.named("smokeClasses"), tasks.named("checkCommonIsLoaderNeutral")
}

// runSmoke starts from a clean run folder (no old result, screenshots or worlds) with the fixed smoke config, and fails
// unless the game wrote a result that says every step passed.
tasks.named("runSmoke") {
	def runDir = file("run-smoke")
	def smokeConfig = file("${commonDir}/src/smoke/resources/glintsmith-smoke.json")
	inputs.file smokeConfig
	timeout = java.time.Duration.ofMinutes(9)
	// The result file decides; the exit code is checked after the result was read
	ignoreExitValue = true
	doFirst {
		["smoke-result.json", "screenshots", "saves", "logs/latest.log", "config/glintsmith.json"].each {
			delete new File(runDir, it)
		}
		new File(runDir, "config").mkdirs()
		java.nio.file.Files.copy(smokeConfig.toPath(), new File(runDir, "config/glintsmith.json").toPath())
	}
	doLast {
		def result = new File(runDir, "smoke-result.json")
		if (!result.isFile()) {
			throw new GradleException("The smoke run wrote no result (${result}); see ${runDir}/logs/latest.log")
		}
		def json = new groovy.json.JsonSlurper().parse(result)
		(json.steps ?: []).each { logger.lifecycle("  ${it.ok ? 'ok  ' : 'FAIL'} ${it.name}${it.error ? ': ' + it.error : ''}") }
		if (!json.passed) {
			throw new GradleException("Smoke run FAILED${json.fatal ? ': ' + json.fatal : ''} (${result})")
		}
		def exit = executionResult.get().exitValue
		if (exit != 0) {
			throw new GradleException("Every smoke step passed but the game exited with code ${exit}")
		}
		logger.lifecycle("Smoke run passed in ${json.durationMs} ms: ${runDir}")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_version as int
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Resolved while configuring: the licence file is named after the mod id.
def licenseFileName = "LICENSE_${mod_id}"
jar {
	from("../LICENSE") {
		rename { licenseFileName }
	}
}
