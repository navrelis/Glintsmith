# Values shared by every loader build of this branch (fabric/, neoforge/, forge/). Each loader's settings.gradle loads
# this file and exposes the values as project properties, so they are defined exactly once. Loader-specific versions
# live in <loader>/gradle.properties.

# Mod metadata
mod_id=glintsmith
mod_name=Glintsmith
mod_version=2.2.0
# Maven group; matches the base package of the sources.
mod_group=navrelis.glintsmith
mod_license=MIT
mod_authors=Navrelis
mod_description=Customize enchantment glints and item outlines for every item from every mod, and fix the gaps in item models.

# Minecraft
minecraft_version=1.21.1
java_version=21
# Version predicate of fabric.mod.json "depends.minecraft" (fabric.mod.json takes a predicate, not a Maven range).
fabric_minecraft_range=>=1.21 <1.21.2
